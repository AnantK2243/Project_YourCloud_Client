[package]
name = "storage_client"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "5.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4", "serde"] }
sysinfo = "0.30"
tokio-tungstenite = { version = "0.21", features = ["native-tls", "tokio-native-tls"] }
bytes = "1"
futures-util = "0.3"
tokio-util = "0.7.15"
native-tls = "0.2"
base64 = "0.21"
sha2 = "0.10"
webrtc = "0.11"
lazy_static = "1.4"
once_cell = "1.21.3"
